server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Extensionless URLs resolve to their .html file, so /about and /games/pulse
    # work alongside the explicit .html links the pages themselves use.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # The 404 is a playable page, not a dead end, so it needs its assets served
    # normally rather than being short-circuited.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Fingerprint-free asset names, so cache modestly rather than forever.
    location /assets/ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # HTML must not be cached, or a redeploy leaves people on the old arcade.
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, must-revalidate";
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript image/svg+xml;
    gzip_min_length 512;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
}
