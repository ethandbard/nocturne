<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Back corridor — NOCTURNE</title>
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/moth.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/site.css">
<script>
  try {
    var s = JSON.parse(localStorage.getItem("nocturne.lights") || '"on"');
    document.documentElement.setAttribute("data-lights", s === "out" ? "out" : "on");
  } catch (e) {
    document.documentElement.setAttribute("data-lights", "on");
  }
</script>
</head>
<body style="--accent: var(--green);">

<div class="wrap">

  <header class="masthead">
    <a class="mark" href="/"><span class="dot"></span>NOCTURNE</a>
    <nav class="nav">
      <a href="/">Arcade</a>
      <a href="/about.html">About</a>
    </nav>
  </header>

  <section style="text-align:center; padding-top:2rem;">
    <p class="eyebrow">404 &middot; No such room</p>
    <h1 class="sign" style="font-size: clamp(1.6rem, 5vw, 2.6rem);">BACK CORRIDOR</h1>
    <p class="muted" style="margin:1.2rem auto 0; max-width:46ch;">
      Whatever you were looking for is not here. It is very dark. Move your
      cursor around until you find the door, then click it. It does not go
      back to the floor.
    </p>
  </section>

  <div class="stage">
    <div class="screen" style="max-width:640px; aspect-ratio: 16 / 9; cursor:none;">
      <canvas id="corridor" aria-label="A dark corridor. Move the cursor to find a door." role="img"></canvas>
    </div>
    <p class="keys" id="hint">The torch is wherever your cursor is.</p>
  </div>

</div>

<footer class="footer wrap">
  <span><a href="/">&larr; give up and go back</a></span>
  <span class="moth-count" data-moth-count>moths <b>0</b>/8</span>
  <span>404</span>
</footer>

<script src="/assets/js/nocturne.js"></script>
<script src="/assets/js/radio.js"></script>
<script>
(function () {
  "use strict";

  /* A 404 that is worth landing on: the page is pitch dark, the cursor is a
     torch, and there is exactly one door. It opens on the back room, not the
     floor. */
  var W = 640, H = 360;
  var canvas = document.getElementById("corridor");
  var ctx = canvas.getContext("2d");
  var hint = document.getElementById("hint");

  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  var torch = { x: W / 2, y: H / 2 };
  var door = {
    x: 60 + Math.random() * (W - 170),
    y: 40 + Math.random() * (H - 170),
    w: 54,
    h: 92
  };
  var found = false;

  function toLocal(e) {
    var rect = canvas.getBoundingClientRect();
    torch.x = ((e.clientX - rect.left) / rect.width) * W;
    torch.y = ((e.clientY - rect.top) / rect.height) * H;
  }

  canvas.addEventListener("pointermove", toLocal);

  canvas.addEventListener("pointerdown", function (e) {
    toLocal(e);
    var inside = torch.x > door.x && torch.x < door.x + door.w &&
                 torch.y > door.y && torch.y < door.y + door.h;
    if (!inside) {
      hint.textContent = "Only wall there.";
      return;
    }
    found = true;
    hint.textContent = "Found it.";
    window.setTimeout(function () { window.location.href = "/back.html"; }, 700);
  });

  function draw() {
    ctx.fillStyle = "#08070e";
    ctx.fillRect(0, 0, W, H);

    /* Brickwork, drawn in full and then hidden by the darkness pass below. */
    ctx.strokeStyle = "#1c1830";
    ctx.lineWidth = 1;
    for (var y = 0; y < H; y += 30) {
      ctx.beginPath();
      ctx.moveTo(0, y); ctx.lineTo(W, y);
      ctx.stroke();
      for (var x = (y / 30) % 2 ? 0 : 40; x < W; x += 80) {
        ctx.beginPath();
        ctx.moveTo(x, y); ctx.lineTo(x, y + 30);
        ctx.stroke();
      }
    }

    ctx.fillStyle = "#241f36";
    ctx.fillRect(door.x, door.y, door.w, door.h);
    ctx.strokeStyle = found ? "#4ade80" : "#3b3550";
    ctx.lineWidth = 2;
    ctx.strokeRect(door.x, door.y, door.w, door.h);
    ctx.fillStyle = found ? "#4ade80" : "#5a5375";
    ctx.beginPath();
    ctx.arc(door.x + door.w - 12, door.y + door.h / 2, 3.5, 0, Math.PI * 2);
    ctx.fill();

    if (found) {
      ctx.save();
      ctx.shadowBlur = 50;
      ctx.shadowColor = "#4ade80";
      ctx.fillStyle = "rgba(74,222,128,0.28)";
      ctx.fillRect(door.x, door.y, door.w, door.h);
      ctx.restore();
    } else {
      var g = ctx.createRadialGradient(torch.x, torch.y, 6, torch.x, torch.y, 120);
      g.addColorStop(0, "rgba(8,7,14,0)");
      g.addColorStop(0.55, "rgba(8,7,14,0.75)");
      g.addColorStop(1, "rgba(8,7,14,0.99)");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);

      ctx.save();
      ctx.shadowBlur = 22;
      ctx.shadowColor = "#38bdf8";
      ctx.fillStyle = "rgba(232,246,255,0.9)";
      ctx.beginPath();
      ctx.arc(torch.x, torch.y, 3.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    requestAnimationFrame(draw);
  }

  draw();
})();
</script>

</body>
</html>
